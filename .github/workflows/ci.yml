name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Match the npm version the lockfile was authored with (>= 11).
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Build needs these to type-check the bills page; no real
          # network calls happen at build time.
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
          ANTHROPIC_API_KEY: placeholder
